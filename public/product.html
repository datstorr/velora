<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product — Velora</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <ul class="nav-left">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="index.html#about">About Us</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="logo-small">VELORA</div>
    <ul class="nav-right">
      <li><a href="cart.html" class="icon-btn">🛍 <span id="cart-count">0</span></a></li>
    </ul>
  </header>

  <div class="product-detail" id="product-detail">
    <p style="padding:40px;">Loading product...</p>
  </div>

  <footer class="site-footer">
    <div class="footer-bottom" style="border-top:none;padding-top:0;">
      <span>© <span id="year"></span> Velora by Datstorr. All rights reserved.</span>
    </div>
  </footer>

  <script src="products.js"></script>
  <script src="cart.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const params = new URLSearchParams(window.location.search);
    const product = getProductById(params.get("id"));
    const container = document.getElementById("product-detail");

    if (!product) {
      container.innerHTML = `<p style="padding:40px;">Product not found. <a href="shop.html" style="color:#8b1220;">Back to shop</a></p>`;
    } else {
      let selectedSize = null;
      let qty = 1;

      container.innerHTML = `
        <div class="placeholder-media">
          ${product.image ? `<img src="${product.image}" alt="${product.name}">` : "Image coming soon"}
        </div>
        <div>
          <div class="pd-name serif">${product.name}</div>
          <div class="pd-price">$${product.price.toFixed(2)}</div>
          <div class="pd-desc">A VELORA original — niche graphic, heavyweight fit, made for the ones who get it.</div>

          <div class="pd-label">Size</div>
          <div class="size-row" id="size-row"></div>
          <div><a href="#" style="font-size:11px;color:#8b1220;text-decoration:underline;">Size Guide</a></div>

          <div class="pd-label" style="margin-top:20px;">Quantity</div>
          <div class="qty-row">
            <button id="qty-minus">−</button>
            <span id="qty-display">1</span>
            <button id="qty-plus">+</button>
          </div>

          <button class="btn" id="add-to-cart-btn">Add to Cart</button>

          <div class="pd-info-block">
            <strong>Shipping:</strong> Orders ship within 1-2 business days. Delivery typically takes 8-10 business days.<br><br>
            <strong>Returns:</strong> 7-day exchange window. See our Refund Policy for details.
          </div>
        </div>
      `;

      const sizeRow = document.getElementById("size-row");
      SIZES.forEach((s) => {
        const btn = document.createElement("button");
        btn.className = "size-btn";
        btn.textContent = s;
        btn.onclick = () => {
          selectedSize = s;
          document.querySelectorAll(".size-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
        };
        sizeRow.appendChild(btn);
      });

      document.getElementById("qty-minus").onclick = () => {
        qty = Math.max(1, qty - 1);
        document.getElementById("qty-display").textContent = qty;
      };
      document.getElementById("qty-plus").onclick = () => {
        qty += 1;
        document.getElementById("qty-display").textContent = qty;
      };

      document.getElementById("add-to-cart-btn").onclick = () => {
        if (!selectedSize) { alert("Please select a size."); return; }
        addToCart(product.id, selectedSize, qty);
      };
    }
  </script>
</body>
</html>
